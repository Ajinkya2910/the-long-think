[project]
name = "long-think"
version = "0.1.0"
description = "Chess match storyteller: turns world championship PGNs into grounded visual stories"
requires-python = ">=3.11"
dependencies = [
  "chess>=1.11",
  "requests>=2.31",
  "anthropic>=0.70",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
longthink = "storyteller.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["storyteller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
